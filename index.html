<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KI-Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mein KI-Studio</title>
<style>
*{box-sizing:border-box;scrollbar-width:thin}
:root{--accent:#00b96b;--fs:16px;--chat-fs:16px;--code-fs:13px;--lh:1.6;--ff:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--content-w:820px;--rail-h:3.5rem}
:root[data-theme=light]{color-scheme:light;--bg:#fff;--bg2:#f5f6f7;--bg3:#e9ebee;--panel:#f7f7f8;--rail:#eceef1;--bd:#e3e5e9;--tx:#1f2329;--tx2:#626870;--tx3:#9aa0a6;--user:#e6f6ee;--code-bg:#f4f5f7;--danger:#e5484d;--shadow:0 8px 30px rgba(0,0,0,.16)}
:root[data-theme=dark]{color-scheme:dark;--bg:#1b1c1e;--bg2:#242528;--bg3:#2e3034;--panel:#202124;--rail:#151617;--bd:#35373b;--tx:#e8eaed;--tx2:#a1a5ad;--tx3:#6f7379;--user:#18382a;--code-bg:#141516;--danger:#ff6b70;--shadow:0 8px 30px rgba(0,0,0,.55)}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{font-family:var(--ff);background:var(--bg);color:var(--tx);overflow:hidden;font-size:1rem;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0}
.dim{color:var(--tx2)}.sm{font-size:.82rem}.pad{padding:.8rem}
.ic{display:inline-grid;place-items:center;line-height:0}
.sp{flex:1}
#app{display:flex;height:100dvh;width:100%;position:relative;overflow:hidden}

/* Rail */
.rail{width:3.6rem;background:var(--rail);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:.7rem 0;gap:.35rem;flex:none}
.rail .logo{width:2.2rem;height:2.2rem;border-radius:.7rem;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.1rem;margin-bottom:.6rem}
.rail button{width:2.7rem;height:2.7rem;border-radius:.75rem;border:0;background:transparent;color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem}
.rail button:hover{background:var(--bg3)}
.rail button.active{background:var(--bg);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rail .rl{display:none;font-size:.62rem;line-height:1}

/* Panel */
.panel{width:17.5rem;flex:none;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;padding:.8rem .9rem .4rem}
.ps{padding:.3rem .8rem .6rem}
.plist{flex:1;overflow-y:auto;padding:0 .5rem .8rem}
.citem{display:flex;align-items:center;gap:.55rem;padding:.55rem .6rem;border-radius:.7rem;cursor:pointer;margin-bottom:.1rem}
.citem:hover{background:var(--bg3)}
.citem.active{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ce{font-size:1.15rem;flex:none}
.ct{flex:1;min-width:0}
.cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.cmeta{font-size:.72rem;color:var(--tx3)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.38);z-index:29}

/* Main / Header */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.chead{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;border-bottom:1px solid var(--bd);min-height:3.3rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--bd);background:var(--bg);border-radius:2rem;padding:.3rem .75rem;max-width:48vw;font-size:.88rem}
.chip:hover{background:var(--bg2)}
.chip .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .dim{font-size:.75rem}
.ib{width:2.1rem;height:2.1rem;border:0;background:transparent;border-radius:.55rem;display:inline-grid;place-items:center;color:var(--tx2);flex:none}
.ib:hover{background:var(--bg3);color:var(--tx)}
.ib.sm{width:1.7rem;height:1.7rem}
.mob{display:none}

/* Messages */
.msgs{flex:1;overflow-y:auto;padding:.4rem 1rem 1rem;overscroll-behavior:contain}
.msgs-in{max-width:var(--content-w);margin:0 auto}
.turn{display:flex;gap:.7rem;margin:1.25rem 0}
.av{width:2.1rem;height:2.1rem;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-size:1rem}
.turn.user .av{background:var(--accent);color:#fff;font-size:.78rem;font-weight:700}
.tb{flex:1;min-width:0}
.tn{font-size:.8rem;color:var(--tx2);margin-bottom:.3rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:baseline}
.tn b{color:var(--tx);font-weight:600;font-size:.88rem}
.txt{font-size:var(--chat-fs);line-height:var(--lh);overflow-wrap:anywhere;word-break:break-word}
.turn.user .utx{white-space:pre-wrap;background:var(--user);padding:.6rem .85rem;border-radius:.9rem;display:inline-block;max-width:100%}
.atts{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0 .4rem}
.att img{max-height:9rem;max-width:12rem;border-radius:.6rem;border:1px solid var(--bd);display:block}
.att.file{background:var(--bg2);border:1px solid var(--bd);border-radius:.5rem;padding:.2rem .55rem;font-size:.8rem}
.style-bubble .turn.user{flex-direction:row-reverse}
.style-bubble .turn.user .av{display:none}
.style-bubble .turn.user .tb{display:flex;flex-direction:column;align-items:flex-end}
.style-bubble .turn.user .tn{display:none}
.style-bubble .turn.ai .part{background:var(--bg2);padding:.45rem .9rem;border-radius:.9rem;margin:.35rem 0}
.stat{font-size:.74rem;color:var(--tx2);opacity:.75;margin-top:.1rem}
.acts{display:flex;gap:.1rem;margin-top:.25rem;opacity:.55}
.turn:hover .acts{opacity:1}
.part.live .txt:empty::after{content:"●●●";letter-spacing:.2em;color:var(--tx3);animation:blink 1s infinite;font-size:.7em}
@keyframes blink{50%{opacity:.25}}
.think{border-left:3px solid var(--bd);margin:.3rem 0 .6rem;padding:.1rem .75rem;color:var(--tx2);font-size:.9em}
.think summary{cursor:pointer;font-size:.85rem}
.think-body{white-space:pre-wrap;margin-top:.3rem;line-height:1.5}
.tool{border:1px solid var(--bd);border-radius:.65rem;margin:.45rem 0;background:var(--bg2);font-size:.86rem}
.tool summary{padding:.45rem .7rem;cursor:pointer;display:flex;gap:.5rem;align-items:center}
.tool .tbody{padding:0 .7rem .6rem}
.tool .lbl{font-size:.72rem;color:var(--tx3);margin:.4rem 0 .1rem}
.pre{white-space:pre-wrap;word-break:break-word;background:var(--code-bg);border-radius:.5rem;padding:.5rem .6rem;margin:0;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;max-height:14rem;overflow:auto}
.spin{width:.85rem;height:.85rem;border:2px solid var(--bd);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);border-radius:.6rem;padding:.55rem .75rem;margin:.4rem 0;font-size:.9rem;white-space:pre-wrap}
.note{color:var(--tx3);font-size:.8rem;margin:.3rem 0}

/* Markdown */
.txt>*:first-child{margin-top:0}.txt>*:last-child{margin-bottom:0}
.txt p{margin:.55em 0}
.txt h1,.txt h2,.txt h3,.txt h4{margin:1em 0 .4em;line-height:1.3}
.txt h1{font-size:1.4em}.txt h2{font-size:1.25em}.txt h3{font-size:1.1em}.txt h4,.txt h5,.txt h6{font-size:1em}
.txt ul,.txt ol{margin:.4em 0;padding-left:1.5em}.txt li{margin:.15em 0}
.txt a{color:var(--accent)}
.txt blockquote{margin:.6em 0;padding:.1em .9em;border-left:3px solid var(--accent);color:var(--tx2)}
.txt hr{border:0;border-top:1px solid var(--bd);margin:1em 0}
.txt code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.88em;background:var(--code-bg);padding:.1em .35em;border-radius:.3rem}
.code{margin:.7em 0;border:1px solid var(--bd);border-radius:.7rem;overflow:hidden;background:var(--code-bg)}
.code-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.3rem .5rem .3rem .75rem;font-size:.75rem;color:var(--tx2);border-bottom:1px solid var(--bd)}
.code-h button{border:0;background:transparent;color:var(--tx2);padding:.2rem .5rem;border-radius:.4rem;font-size:.75rem}
.code-h button:hover{background:var(--bg3);color:var(--tx)}
.code pre{margin:0;padding:.7rem .85rem;overflow-x:auto}
.code pre code{background:none;padding:0;font-size:var(--code-fs);line-height:1.5;white-space:pre}
.tbl{overflow-x:auto;margin:.6em 0}
.txt table{border-collapse:collapse;font-size:.92em}
.txt th,.txt td{border:1px solid var(--bd);padding:.35em .7em;min-width:7em;overflow-wrap:normal;word-break:normal;hyphens:manual;vertical-align:top}
.txt th{background:var(--bg2)}

/* Empty */
.empty{text-align:center;padding:12vh 1rem 2rem;color:var(--tx2)}
.empty .big{font-size:3rem}
.empty h2{color:var(--tx);margin:.4rem 0}
.banner{margin:1.2rem auto 0;max-width:26rem;background:var(--bg2);border:1px solid var(--bd);border-radius:.8rem;padding:.9rem}
.banner p{margin:0 0 .6rem}

/* Composer */
.composer{padding:.3rem 1rem .8rem}
.cin{max-width:var(--content-w);margin:0 auto}
.cbox{border:1px solid var(--bd);border-radius:1.1rem;background:var(--bg);padding:.5rem .6rem .4rem;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:var(--chat-fs);line-height:1.45;max-height:35vh;padding:.2rem .25rem;display:block}
.ctools{display:flex;align-items:center;gap:.2rem;margin-top:.2rem}
.send{width:2.3rem;height:2.3rem;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center}
.send.stop{background:var(--tx2)}
.pend{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.3rem}
.pend:empty{display:none}
.pchip{position:relative;display:flex;align-items:center;gap:.4rem;background:var(--bg2);border:1px solid var(--bd);border-radius:.6rem;padding:.2rem .3rem .2rem .5rem;font-size:.8rem;max-width:12rem}
.pchip img{height:2.4rem;border-radius:.4rem}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Buttons / forms */
.btn{border:1px solid var(--bd);background:var(--bg);border-radius:.65rem;padding:.5rem .9rem;font-size:.92rem}
.btn:hover{background:var(--bg2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--bd))}
.btn.full{width:100%}
.btn.sm{padding:.25rem .6rem;font-size:.82rem}
.inp{width:100%;padding:.55rem .7rem;border:1px solid var(--bd);border-radius:.6rem;background:var(--bg);font-size:.95rem;outline:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:7rem;line-height:1.45}
.field{margin:.9rem 0}
.field>label{display:block;font-size:.82rem;color:var(--tx2);margin-bottom:.3rem}
.row{display:flex;gap:.5rem;align-items:center}
.sw{position:relative;display:inline-block;width:2.4rem;height:1.4rem;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .sl{position:absolute;inset:0;background:var(--bg3);border-radius:1rem;transition:.15s;cursor:pointer}
.sw .sl::after{content:"";position:absolute;left:.15rem;top:.15rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+.sl{background:var(--accent)}
.sw input:checked+.sl::after{transform:translateX(1rem)}
.sw.sm{width:2rem;height:1.2rem}.sw.sm .sl::after{width:.9rem;height:.9rem}.sw.sm input:checked+.sl::after{transform:translateX(.8rem)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:.65rem;overflow:hidden}
.seg button{border:0;background:transparent;padding:.4rem .75rem;font-size:.88rem}
.seg button.on{background:var(--accent);color:#fff}

/* Modal */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:grid;place-items:center;padding:1rem}
.modal{background:var(--bg);border-radius:1rem;width:min(30rem,100%);max-height:88dvh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:min(46rem,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:.7rem .8rem .5rem 1.1rem}
.mb{padding:0 1.1rem .6rem;overflow-y:auto;flex:1}
.mf{display:flex;justify-content:flex-end;gap:.5rem;padding:.7rem 1.1rem 1rem}
.mlist{margin-top:.6rem;max-height:52dvh;overflow-y:auto}
.mgroup{font-size:.75rem;color:var(--tx3);margin:.7rem 0 .2rem;text-transform:uppercase;letter-spacing:.04em}
.mrow{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:.55rem;cursor:pointer;font-size:.92rem;overflow-wrap:anywhere}
.mrow:hover{background:var(--bg2)}
.mrow.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cb{width:1.2rem;height:1.2rem;border:1.5px solid var(--bd);border-radius:.3rem;display:inline-grid;place-items:center;font-size:.8rem;flex:none;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);background:#222;color:#fff;padding:.55rem 1rem;border-radius:2rem;z-index:200;font-size:.9rem;max-width:90vw;box-shadow:var(--shadow)}
.preview-frame{width:100%;height:60dvh;border:1px solid var(--bd);border-radius:.6rem;background:#fff}

/* Pages (settings/agents/compare) */
.page{flex:1;overflow-y:auto;min-height:0}
.page-in{max-width:60rem;margin:0 auto;padding:1rem 1.2rem 3rem}
.page h2{font-size:1.3rem;margin:.2rem 0 .8rem}
.tabs{display:flex;gap:.3rem;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:1rem;padding-bottom:.4rem}
.tabs button{border:0;background:transparent;padding:.45rem .85rem;border-radius:.6rem;color:var(--tx2);white-space:nowrap}
.tabs button.on{background:var(--bg3);color:var(--tx);font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--bd)}
.sl-l{flex:1;min-width:0}.sl-c{flex:none;max-width:60%}
.rng{display:flex;align-items:center;gap:.6rem;min-width:11rem}
.rng input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:.4rem;border-radius:1rem;background:var(--bg3);outline:0;margin:.6rem 0;color:var(--tx)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.25rem;height:1.25rem;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
input[type=range]:disabled{opacity:.45}
input[type=color]{width:2rem;height:2rem;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
.rv{min-width:3rem;text-align:right;color:var(--tx2);font-size:.85rem}
.sample{border:1px dashed var(--bd);border-radius:.8rem;padding:.8rem 1rem;margin:.8rem 0;font-size:var(--chat-fs);line-height:var(--lh)}
.sample code{font-family:ui-monospace,Consolas,monospace;font-size:var(--code-fs);background:var(--code-bg);padding:.1em .4em;border-radius:.3rem}
.swatches{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.swatch{width:1.7rem;height:1.7rem;border-radius:50%;border:2px solid transparent;padding:0}
.swatch.on{border-color:var(--tx)}
.prov{display:flex;gap:1rem;align-items:flex-start}
.prov-list{width:15rem;flex:none;display:flex;flex-direction:column;gap:.2rem}
.prow{display:flex;align-items:center;gap:.5rem;padding:.55rem .6rem;border-radius:.65rem;cursor:pointer;border:1px solid transparent}
.prow:hover{background:var(--bg2)}
.prow.active{background:var(--bg2);border-color:var(--bd)}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.pdot{width:.5rem;height:.5rem;border-radius:50%;background:var(--bg3);flex:none}.pdot.on{background:var(--accent)}
.prov-detail{flex:1;min-width:0}
.mchips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
.mchip{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg2);border:1px solid var(--bd);border-radius:.5rem;padding:.2rem .3rem .2rem .6rem;font-size:.82rem}
.mchip button{border:0;background:transparent;color:var(--tx3);padding:0 .25rem}
.status{font-size:.85rem;margin-top:.4rem;white-space:pre-wrap}.status.ok{color:var(--accent)}.status.bad{color:var(--danger)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.8rem}
.card{border:1px solid var(--bd);border-radius:.9rem;padding:.9rem;background:var(--bg);display:flex;flex-direction:column;gap:.4rem}
.card .em{font-size:1.8rem}
.card .desc{color:var(--tx2);font-size:.85rem;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;flex-wrap:wrap;gap:.25rem}
.badge{background:var(--bg3);border-radius:.4rem;padding:.05rem .45rem;font-size:.7rem;color:var(--tx2)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.3rem}
.checks label{display:flex;gap:.5rem;align-items:center;font-size:.88rem;padding:.2rem 0}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:.8rem;margin-top:1rem}
.col{border:1px solid var(--bd);border-radius:.9rem;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.col-h{padding:.55rem .8rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.88rem}
.col-h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-b{padding:.2rem .85rem;min-height:6rem}
.col-f .btn{color:var(--tx)}
.col-f{padding:.4rem .8rem;border-top:1px solid var(--bd);font-size:.75rem;color:var(--tx3);display:flex;justify-content:space-between;align-items:center}

/* Mobile */
@media (max-width:820px){
  #app{flex-direction:column-reverse}
  .rail{width:100%;height:var(--rail-h);flex-direction:row;justify-content:space-around;padding:0 .4rem env(safe-area-inset-bottom);border-right:0;border-top:1px solid var(--bd);gap:0}
  .rail .logo,.rail .sp{display:none}
  .rail button{width:4.5rem;height:3rem}
  .rail .rl{display:block}
  body.kb .rail{display:none}
  .panel{position:absolute;left:0;top:0;bottom:var(--rail-h);width:min(20rem,86vw);z-index:30;transform:translateX(-104%);transition:transform .2s;box-shadow:var(--shadow)}
  .panel.open{transform:none}
  .mob{display:inline-grid}
  .msgs{padding:.2rem .75rem 1rem}
  .composer{padding:.2rem .6rem .5rem}
  .turn{gap:.5rem}
  .av{width:1.8rem;height:1.8rem;font-size:.9rem}
  .prov{flex-direction:column}
  .prov-list{width:100%;flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .prow{flex:none}
  .srow{flex-direction:column;align-items:stretch;gap:.5rem}
  .sl-c{max-width:100%}
  .toast{bottom:5.5rem}
  .page-in{padding:.8rem .8rem 3rem}
  .chead{gap:.3rem;padding:.5rem .5rem}
  .chip{max-width:38vw;min-width:0;padding:.3rem .6rem}
  .chip .dim{display:none}
}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ===== Mein KI-Studio – privater KI-Client (eine Datei, alles lokal) ===== */
const VERSION = '1.0.0';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isPlain = o => o && typeof o === 'object' && !Array.isArray(o);

function codeBlock(lang, code) {
  const l = (lang || '').toLowerCase();
  const prev = (l === 'html' || l === 'svg') ? '<button data-act="preview">Vorschau</button>' : '';
  return `<div class="code"><div class="code-h"><span>${esc(lang || 'text')}</span><span>${prev}<button data-act="copycode">Kopieren</button></span></div><pre><code>${esc(code)}</code></pre></div>`;
}
function inline(s) {

  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+[^\s<).,;:!?])/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>').replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>').replace(/(^|[^_\w])_([^_\n]+?)_(?![_\w])/g, '$1<em>$2</em>');

function mdBlocks(text, blocks) {
  const L = text.split('\n'); let i = 0, out = '';

  const blockStart = j => /^#{1,6}\s/.test(L[j]) || ph.test(L[j].trim()) || listRe.test(L[j]) || /^\s*>/.test(L[j]) || hrRe.test(L[j]) || tableAt(j);
  while (i < L.length) {
    const line = L[i], t = line.trim();
    if (!t) { i++; continue; }
    let m;
    if ((m = ph.exec(t))) { out += blocks[+m[1]]; i++; continue; }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) { const n = m[1].length; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (hrRe.test(line)) { out += '<hr>'; i++; continue; }

      continue;
    }
    if (/^\s*>/.test(line)) {
      const q = []; while (i < L.length && /^\s*>/.test(L[i])) { q.push(L[i].replace(/^\s*>\s?/, '')); i++; }

    blocks.push(codeBlock(lang.trim().split(/\s/)[0], code)); return pre + '\u0000' + (blocks.length - 1) + '\u0000';

    iframe.srcdoc = '<!doctype html><html><body><script>' + frameJs + '<\/script></body></html>';
    document.body.appendChild(iframe);
  });
}

/* ===== Dialoge ===== */
function openModal({ title, body, buttons = [], wide = false, onClose }) {
  const back = h('div', { class: 'mback' });
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const box = h('div', { class: 'modal' + (wide ? ' wide' : '') },
    h('div', { class: 'mh' }, h('b', null, title || ''), h('button', { class: 'ib', onclick: close }, ic('x'))),
    h('div', { class: 'mb' }, body));
  if (buttons.length) box.append(h('div', { class: 'mf' }, buttons.map(b => h('button', {
    class: 'btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : ''),
    onclick: async () => { const r = b.onClick ? await b.onClick() : undefined; if (r !== false) close(); },
  }, b.label))));
  back.append(box);
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });

}

/* ===== Modell-/Agenten-Auflösung ===== */
const provName = id => getProv(id)?.name || id;
const modelLabel = r => r.m;
function modelExists(r) { const p = r && getProv(r.p); return !!(p && p.enabled && p.models.some(m => m.id === r.m)); }
function resolveModel(chat) {
  const agent = getAgent(chat.agentId);
  for (const r of [chat.model, agent?.model, S.settings.defaultModel]) if (modelExists(r)) return r;
  for (const p of S.providers) if (p.enabled && p.models.length) return { p: p.id, m: p.models[0].id };

/* ===== Chat-Engine ===== */
function buildSystem(agent) {
  let s = agent.prompt || '';
  if (S.settings.dateInPrompt) s += `\n\nAktuelles Datum: ${new Date().toLocaleDateString('de-DE', { dateStyle: 'full' })}. (Nur das Datum, damit der Cache gültig bleibt – die genaue Uhrzeit liefert das Werkzeug get_datetime.)`;
  return s.trim();
}
const agentTools = a => (a.tools || []).filter(n => TOOLS[n]).map(n => ({ name: n, description: TOOLS[n].description, parameters: TOOLS[n].parameters }));
function buildHistory(chat, agent) {
  let ms = chat.messages.filter(m => !(m.role === 'assistant' && !m.content && !(m.toolCalls && m.toolCalls.length)));
  const resIds = new Set(ms.filter(m => m.role === 'tool' && m.status !== 'running').map(m => m.toolCallId));
  ms = ms.map(m => (m.role === 'assistant' && m.toolCalls?.length ? { ...m, toolCalls: m.toolCalls.filter(t => resIds.has(t.id)) } : m));
  const callIds = new Set(ms.filter(m => m.role === 'assistant').flatMap(m => (m.toolCalls || []).map(t => t.id)));
  ms = ms.filter(m => m.role !== 'tool' || (callIds.has(m.toolCallId) && m.status !== 'running'));
  ms = ms.filter(m => !(m.role === 'assistant' && !m.content && !(m.toolCalls && m.toolCalls.length)));
  const n = agent.contextCount || 30;
  if (ms.length > n) ms = ms.slice(-n);
  while (ms.length && ms[0].role !== 'user') ms.shift();
  return ms;
}
const toolBrief = a => { const v = Object.values(a || {}).find(x => typeof x === 'string'); return v ? '· ' + (v.length > 40 ? v.slice(0, 40) + '…' : v).replace(/\s+/g, ' ') : ''; };
async function runTool(tc, signal) {
  const t0 = Date.now(), def = TOOLS[tc.name];
  if (!def) return { text: 'Unbekanntes Werkzeug: ' + tc.name, error: true, ms: 0 };
  if (S.settings.confirm?.[tc.name]) {
    const ok = await confirmDialog('Werkzeug ausführen?', h('div', null, h('b', null, def.label), h('pre', { class: 'pre' }, JSON.stringify(tc.args, null, 2))), 'Ausführen');
    if (!ok) return { text: 'Vom Nutzer abgelehnt.', error: true, ms: 0 };
  }
  try {
    let out = await def.run(tc.args || {}, { signal });
    if (typeof out !== 'string') out = JSON.stringify(out, null, 2);
    if (out.length > MAX_TOOL_OUT) out = out.slice(0, MAX_TOOL_OUT) + '\n…[gekürzt]';
    return { text: out || '(leer)', ms: Date.now() - t0 };
  } catch (e) { return { text: 'Fehler: ' + errText(e), error: true, ms: Date.now() - t0 }; }
}
function liveBinder(am) {
  let raf = 0;
  const update = () => {
    raf = 0;
    const part = UI.msgs && UI.msgs.querySelector(`[data-mid="${am.id}"]`);
    if (!part) return;
    part.querySelector('.txt').innerHTML = md(am.content);
    if (am.reasoning) { const th = part.querySelector('.think'); th.hidden = false; th.open = true; part.querySelector('.think-body').textContent = am.reasoning; }
    if (S.stick) UI.msgs.scrollTop = UI.msgs.scrollHeight;
  };
  return { schedule() { if (!raf) raf = requestAnimationFrame(update); }, flush() { if (raf) cancelAnimationFrame(raf); update(); } };
}
const refresh = chat => { if (S.view === 'chat' && S.chatId === chat.id) renderMessages(); };
async function runChat(chat) {
  const agent = getAgent(chat.agentId), ref = resolveModel(chat), prov = getProv(ref.p);
  const ctrl = new AbortController(); S.running.set(chat.id, ctrl); updateRunUI();
  const tools = agentTools(agent), system = buildSystem(agent), maxSteps = S.settings.maxSteps || 8;
  let finished = false;
  try {
    for (let step = 0; step < maxSteps; step++) {
      if (ctrl.signal.aborted) { finished = true; break; }
      const am = { id: uid(), role: 'assistant', content: '', reasoning: '', toolCalls: [], ts: Date.now(), model: ref };
      chat.messages.push(am); refresh(chat);
      const live = liveBinder(am), t0 = Date.now();
      try {
        const res = await callModel({ provider: prov, model: ref.m, system, messages: buildHistory(chat, agent), tools, temperature: agent.temperature, maxTokens: agent.maxTokens, signal: ctrl.signal, onText: t => { am.content += t; live.schedule(); }, onReasoning: t => { am.reasoning += t; live.schedule(); } });
        am.toolCalls = res.toolCalls || []; am.usage = res.usage; am.finish = res.finish;
      } catch (e) {
        if (ctrl.signal.aborted) am.aborted = true; else { am.error = errText(e); console.error(e); }
      }
      am.ms = Date.now() - t0; live.flush();
      if (am.aborted && !am.content && !am.reasoning && !am.toolCalls.length) chat.messages.splice(chat.messages.indexOf(am), 1);
      if (am.error || am.aborted) { finished = true; break; }
      if (!am.content && !am.toolCalls.length && !am.reasoning) am.error = 'Leere Antwort vom Modell.';
      if (!am.toolCalls.length) { finished = true; break; }
      saveChat(chat); refresh(chat);
      for (const tc of am.toolCalls) {
        const tm = { id: uid(), role: 'tool', toolCallId: tc.id, name: tc.name, content: '', status: 'running', ts: Date.now() };
        chat.messages.push(tm); refresh(chat);
        const out = await runTool(tc, ctrl.signal);
        tm.content = out.text; tm.status = out.error ? 'error' : 'done'; tm.ms = out.ms;
        refresh(chat);
        if (ctrl.signal.aborted) break;
      }
      if (ctrl.signal.aborted) { finished = true; break; }
    }
    if (!finished) chat.messages.push({ id: uid(), role: 'assistant', content: '', error: `Maximale Anzahl Werkzeug-Schritte (${maxSteps}) erreicht. Schreibe „weiter“, um fortzufahren.`, ts: Date.now(), model: ref });
  } finally {
    for (const m of chat.messages) if (m.role === 'tool' && m.status === 'running') { m.status = 'error'; m.content = 'Abgebrochen'; }
    S.running.delete(chat.id); chat.updatedAt = Date.now();
    await saveChat(chat); updateRunUI(); refresh(chat); renderChatList();
  }
}
function doSend() {
  const chat = curChat(); if (!chat || S.running.has(chat.id)) return;
  const text = S.draft.trim(); if (!text && !S.pending.length) return;
  if (!ensureReady(chat)) return;
  chat.messages.push({ id: uid(), role: 'user', content: text, attachments: S.pending.slice(), ts: Date.now() });
  if (chat.title === 'Neuer Chat') chat.title = (text || S.pending[0]?.name || 'Chat').replace(/\s+/g, ' ').slice(0, 48);
  chat.updatedAt = Date.now(); S.draft = ''; S.pending = []; S.stick = true;
  UI.ta.value = ''; autosize(UI.ta); renderPending(); renderChatList(); renderMessages(); saveChat(chat); runChat(chat);
}
function regenerate(chat) {
  if (S.running.has(chat.id)) return;
  let i = chat.messages.length - 1; while (i >= 0 && chat.messages[i].role !== 'user') i--;
  if (i < 0 || !ensureReady(chat)) return;
  chat.messages.length = i + 1; S.stick = true; renderMessages(); runChat(chat);
}
async function editUser(chat, m) {

    srow('Reader-Proxy', h('input', { class: 'inp', value: st.proxy, oninput: e => { st.proxy = e.target.value.trim(); save(); } }), 'Wird genutzt, wenn eine Seite den direkten Abruf aus dem Browser blockiert. {url} wird ersetzt. Leer lassen = nur direkt. Hinweis: Der Proxy sieht die abgerufenen Adressen.'),
    h('h3', { style: { marginTop: '1.4rem' } }, 'Gespeicherte Notizen'), notesBox);
}
function settingsData() {
  let withKeys = false; const st = S.settings;
  const imp = h('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: async e => { const f = e.target.files[0]; e.target.value = ''; if (f) importAll(f); } });
  const usage = h('span', { class: 'dim sm' }); navigator.storage?.estimate?.().then(e => { usage.textContent = `Belegt: ${(e.usage / 1048576).toFixed(1)} MB von ca. ${(e.quota / 1073741824).toFixed(1)} GB`; });
  return h('div', null,
    srow('Backup exportieren', h('div', null, h('label', { class: 'row sm dim', style: { marginBottom: '.4rem' } }, h('input', { type: 'checkbox', onchange: e => { withKeys = e.target.checked; } }), 'API-Schlüssel mitexportieren'), h('button', { class: 'btn', onclick: () => exportAll(withKeys) }, 'Backup speichern (.json)')), 'Chats, Agenten, Anbieter, Einstellungen, Notizen.'),
    srow('Backup importieren', h('div', null, h('button', { class: 'btn', onclick: () => imp.click() }, 'Datei wählen'), imp), 'Fügt zusammen; vorhandene Einträge mit gleicher ID werden überschrieben.'),
    srow('Speicher', h('div', null, usage, h('br'), h('button', { class: 'btn sm', onclick: async () => toast((await navigator.storage?.persist?.()) ? 'Dauerhafter Speicher aktiv' : 'Vom Browser nicht gewährt') }, 'Dauerhaften Speicher anfragen')), 'Verhindert, dass der Browser Daten bei Platzmangel löscht.'),
    srow('Alle Chats löschen', h('button', { class: 'btn danger', onclick: async () => { if (await confirmDialog('Alle Chats löschen?', 'Das kann nicht rückgängig gemacht werden.', 'Löschen')) { S.running.forEach(c => c.abort()); await DB.clear('chats'); S.chats = []; S.chatId = null; newChat(); S.view = 'settings'; render(); } } }, 'Chats löschen')),
    srow('Alles zurücksetzen', h('button', { class: 'btn danger', onclick: async () => { if (await confirmDialog('Wirklich alles löschen?', 'Chats, Schlüssel, Agenten, Notizen und Einstellungen werden entfernt.', 'Alles löschen')) { for (const s of ['kv', 'chats', 'notes']) await DB.clear(s); location.reload(); } } }, 'Alles löschen')));
}
async function exportAll(withKeys) {
  const settings = structuredClone(S.settings); if (!withKeys) { settings.search.tavilyKey = ''; settings.search.jinaKey = ''; }
  const data = { app: 'ki-studio', version: 1, exported: new Date().toISOString(), settings, providers: S.providers.map(p => (withKeys ? p : { ...p, apiKey: '' })), agents: S.agents, chats: S.chats.filter(c => c.messages.length), notes: await DB.all('notes') };
  download('ki-studio-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data));
}
async function importAll(file) {
  try {
    const d = JSON.parse(await file.text()); if (d.app !== 'ki-studio') throw new Error('Keine KI-Studio-Sicherung.');
    if (!(await confirmDialog('Backup importieren?', 'Vorhandene Einträge mit gleicher ID werden überschrieben.', 'Importieren'))) return;
    if (d.settings) await DB.put('kv', deepMerge(structuredClone(S.settings), d.settings), 'settings');
    if (d.providers) { const cur = S.providers; for (const p of d.providers) { const ex = cur.find(x => x.id === p.id); if (ex) Object.assign(ex, p, { apiKey: p.apiKey || ex.apiKey }); else cur.push(p); } await DB.put('kv', cur, 'providers'); }
    if (d.agents) await DB.put('kv', d.agents, 'agents');
    for (const c of d.chats || []) await DB.put('chats', c);
    for (const n of d.notes || []) await DB.put('notes', n);
    location.reload();
  } catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
}
function settingsAbout() {
  const standalone = matchMedia('(display-mode: standalone)').matches;
  return h('div', null, h('h3', null, 'Mein KI-Studio ' + VERSION),
    h('p', { class: 'dim' }, 'Privater KI-Client im Browser: mehrere Anbieter, Chat mit Verlauf, Agenten mit Werkzeugen und Modellvergleich. Es gibt keinen eigenen Server – Chats und Schlüssel liegen nur auf diesem Gerät, Anfragen gehen direkt an den jeweiligen Anbieter.'),
    h('div', { class: 'srow' }, h('div', { class: 'sl-l' }, 'App installieren', h('div', { class: 'dim sm' }, standalone ? 'Läuft bereits als installierte App.' : 'Funktioniert, wenn die Seite über https (z. B. GitHub Pages) geöffnet ist. Sonst im Chrome-Menü ⋮ → „App installieren“ bzw. „Zum Startbildschirm“.')), h('div', { class: 'sl-c' }, S.installEvt ? h('button', { class: 'btn primary', onclick: async () => { S.installEvt.prompt(); await S.installEvt.userChoice; S.installEvt = null; render(); } }, 'Installieren') : null)),
    h('p', { class: 'dim sm' }, 'Sicherheitshinweis: API-Schlüssel liegen unverschlüsselt im Browser-Speicher dieses Geräts. Nutze die Seite nur auf eigenen Geräten und gib keine Schlüssel mit hohem Limit ein.'));
}

/* ===== Start ===== */
async function init() {
  try { await loadAll(); } catch (e) { document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Speicher (IndexedDB) nicht verfügbar: ' + esc(e.message) + '</p>'; return; }
  applyAppearance();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') applyAppearance(); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const code = b.closest('.code'); const text = code?.querySelector('code')?.textContent || '';
    if (b.dataset.act === 'copycode') copyText(text);
    else if (b.dataset.act === 'preview') openModal({ title: 'Vorschau', wide: true, body: h('iframe', { class: 'preview-frame', sandbox: 'allow-scripts', srcdoc: /^\s*<svg/i.test(text) ? '<body style="margin:0">' + text + '</body>' : text }) });
  });
  document.addEventListener('focusin', e => { if (e.target.matches?.('.cbox textarea') && matchMedia('(max-width:820px)').matches) document.body.classList.add('kb'); });
  document.addEventListener('focusout', e => { if (e.target.matches?.('.cbox textarea')) document.body.classList.remove('kb'); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.view === 'settings' && S.tab === 'about') render(); });
  const first = S.chats.find(c => c.messages.length);
  if (first) S.chatId = first.id;
  render();
  navigator.storage?.persist?.();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();

</script>
